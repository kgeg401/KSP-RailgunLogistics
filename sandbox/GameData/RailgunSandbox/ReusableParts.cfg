// Clone definitions reference the player's installed KSP part models, skeletons and colliders.
// The pod has no procedural body geometry and no redistributed Squad assets.
@PART[*]:HAS[@MODULE[ModuleDockingNode],!MODULE[RailgunDeliveryPort]]:FOR[RailgunSandbox]
{
    MODULE
    {
        name = RailgunDeliveryPort
    }
}

+PART[probeStackSmall]:FINAL
{
    @name = krlReusableProbe
    @title = KRL Reusable Pod Guidance
    @category = none
    !MODULE[MechJebCore],* {}
    MODULE
    {
        name = MechJebCore
    }
    MODULE
    {
        name = RailgunFlightPod
    }
}
+PART[RCSFuelTank]:FINAL
{
    @name = krlReusableMonoCargo
    @title = KRL Locked Monopropellant Cargo
    @category = none
    MODULE
    {
        name = RailgunCargoIsolation
    }
    @RESOURCE[MonoPropellant]
    {
        @amount = 0
        %flowState = False
    }
}
+PART[fuelTank]:FINAL
{
    @name = krlReusableFuelCargo
    @title = KRL Locked Liquid Propellant Cargo
    @category = none
    // CryoTanks/B9 fuel switching otherwise refills and unlocks these tanks on load.
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]] {}
    !MODULE[ModuleCryoTank],* {}
    MODULE
    {
        name = RailgunCargoIsolation
    }
    // CryoTanks can remove the base RESOURCE nodes before this FINAL clone.
    // Explicitly create the cargo tank; an @ edit would silently do nothing.
    !RESOURCE,* {}
    RESOURCE
    {
        name = LiquidFuel
        amount = 0
        maxAmount = 180
        flowState = False
    }
    RESOURCE
    {
        name = Oxidizer
        amount = 0
        maxAmount = 220
        flowState = False
    }
}
