// Native Clamp-O-Tron model and docking mechanism, with a persistent cargo bus.
// The model is loaded from the player's installation; no Squad assets are distributed.
+PART[dockingPort2]:FOR[RailgunLogistics]
{
    @name = kgeg4RailgunCargoPod
    @title = KRL Cargo Docking Pod
    @description = Assisted orbital delivery pod. Cargo remains aboard until its Clamp-O-Tron docks. The empty pod stays attached and can be undocked normally.
    @category = Utility
    @TechRequired = start
    @entryCost = 0
    @cost = 1000
    @mass = 0.3
    @crashTolerance = 20
    !MODULE[ModuleCargoPart] {}
    !MODULE[TweakScale] {}
    @MODULE[ModuleDockingNode]
    {
        @canRotate = False
        %stagingEnabled = False
        %crossfeed = False
    }
    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
    }
    MODULE
    {
        name = RailgunCargoPod
    }
}
